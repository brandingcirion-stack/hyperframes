<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP local (3.15): el CDN público está bloqueado en este entorno y así el render no depende de la red. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Maven Pro servida localmente (Google Fonts, licencia OFL): subconjunto latino, pesos 400–700. */
      @font-face {
        font-family: "Maven Pro";
        src: url("assets/fonts/MavenPro-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      .escena {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Muestra v03 · solo la escena «Beneficios para tu negocio» (15–24 s del guion de 30 s).
      En el video completo este archivo será el anfitrión de las cinco escenas.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div
        id="fondo-vapor"
        class="escena"
        data-composition-id="vapor"
        data-composition-src="compositions/vapor.html"
        data-start="0"
        data-duration="9"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="escena-beneficios"
        class="escena"
        data-composition-id="beneficios"
        data-composition-src="compositions/beneficios.html"
        data-start="0"
        data-duration="9"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Pulsos estéreo sintetizados (scripts/generar-sfx-beneficios.py). Música: pendiente. -->
      <audio
        id="sfx-beneficios"
        src="assets/audio/beneficios-sfx.flac"
        data-start="0"
        data-duration="9"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>

    <script>
      // La animación vive en las sub-composiciones; el anfitrión solo fija la duración.
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 9);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
