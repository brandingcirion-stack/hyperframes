<!doctype html>
<html
  lang="es"
  data-composition-variables='[{"id":"idioma","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"},{"value":"pt","label":"Português"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP local (3.15): el CDN público está bloqueado en este entorno y así el render no depende de la red. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Maven Pro servida localmente (Google Fonts, licencia OFL): subconjunto latino, pesos 400–700. */
      @font-face {
        font-family: "Maven Pro";
        src: url("assets/fonts/MavenPro-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }
      .escena,
      .video {
        position: absolute;
        inset: 0;
      }
      .video {
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!--
      Cirion · Cloud Connect — 36 s: intro (3 s) + guion de 30 s + out (3 s).
      Idioma por variable: español por defecto; inglés y portugués con
      render --variables '{"idioma":"en"}' o '{"idioma":"pt"}'. Los textos viven en cada escena.
      Escenas del guion (tiempos globales): pregunta 3–7 · dato 7–12 · conexión 12–18 · beneficios 18–27 · cierre 27–33.
    -->
    <div
      data-hf-id="hf-nk1p"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="36"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <video
        data-hf-id="hf-iw7h"
        id="intro"
        class="video clip"
        src="assets/video/intro.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="3"
        data-track-index="0"
      ></video>

      <div
        data-hf-id="hf-53zx"
        id="fondo-vapor"
        class="escena"
        data-composition-id="vapor"
        data-composition-src="compositions/vapor.html"
        data-start="3"
        data-duration="30"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        data-hf-id="hf-dvfw"
        id="escena-pregunta"
        class="escena"
        data-composition-id="pregunta"
        data-composition-src="compositions/pregunta.html"
        data-start="3"
        data-duration="4"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        data-hf-id="hf-futl"
        id="escena-dato"
        class="escena"
        data-composition-id="dato"
        data-composition-src="compositions/dato.html"
        data-start="7"
        data-duration="5"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        data-hf-id="hf-j4z9"
        id="escena-conexion"
        class="escena"
        data-composition-id="conexion"
        data-composition-src="compositions/conexion.html"
        data-start="12"
        data-duration="6"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        data-hf-id="hf-z18c"
        id="escena-beneficios"
        class="escena"
        data-composition-id="beneficios"
        data-composition-src="compositions/beneficios.html"
        data-start="18"
        data-duration="9"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        data-hf-id="hf-v12e"
        id="escena-cierre"
        class="escena"
        data-composition-id="cierre"
        data-composition-src="compositions/cierre.html"
        data-start="27"
        data-duration="6"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <video
        data-hf-id="hf-kpzw"
        id="out"
        class="video clip"
        src="assets/video/out.mp4"
        muted
        playsinline
        data-start="33"
        data-duration="3"
        data-track-index="3"
      ></video>

      <!-- Banda sonora: música synth tech + efectos, mezcla normalizada (scripts/generar-audio.py). -->
      <audio
        data-hf-id="hf-rujx"
        id="banda-sonora"
        src="assets/audio/banda-sonora.flac"
        data-start="0"
        data-duration="36"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // La intro se funde a negro antes de la primera escena.
      tl.to("#intro", { opacity: 0, duration: 0.4, ease: "sine.in" }, 2.6);
      tl.set({}, {}, 36);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
