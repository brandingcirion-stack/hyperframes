      <script>
        (() => {
          // Idioma: override de render (--variables '{"idioma":"en"}') o, si no hay, el valor por defecto de la escena.
          const idioma =
            (window.__hfVariables && window.__hfVariables.idioma) ||
            window.__hyperframes.getVariables().idioma ||
            "es";
          const TEXTOS = {
            es: {
              sub: "Conexión privada entre tu red y los principales proveedores cloud.",
              red: "Tu red",
            },
            en: {
              sub: "Private connection between your network and the leading cloud providers.",
              red: "Your network",
            },
            pt: {
              sub: "Conexão privada entre sua rede e os principais provedores de nuvem.",
              red: "Sua rede",
            },
          };
          const t = TEXTOS[idioma] || TEXTOS.es;
          document.querySelector("#c-sub").textContent = t.sub;
          document.querySelector("#c-red-texto").textContent = t.red;

          const tl = gsap.timeline({ paused: true });
          // Tiempos en la grilla de 120 BPM (scripts/generar-audio.py):
          // enlace Tu red → nube 0,9–1,5 s; destinos en 2,0 / 2,25 / 2,5 / 2,75 / 3,0 s.

          // Entrada: continúa el movimiento hacia la izquierda (cut-the-curve LEFT).
          tl.fromTo(
            ["#c-grupo", "#c-portador"],
            { x: 230, opacity: 0.35 },
            { x: 0, opacity: 1, duration: 0.4, ease: "power4.out" },
            0,
          );

          // Tu red → Cloud Connect: la conexión privada se dibuja y enciende la nube al llegar.
          tl.to(
            "#c-enlace",
            { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.in" },
            0.9,
          );
          tl.set("#c-enlace-chispa", { opacity: 1 }, 0.9);
          tl.to(
            "#c-enlace-chispa",
            { attr: { "stroke-dashoffset": -0.92 }, duration: 0.6, ease: "power2.in" },
            0.9,
          );
          tl.set("#c-enlace-chispa", { opacity: 0 }, 1.5);
          tl.fromTo(
            "#c-nube-luz",
            { opacity: 0.9 },
            { opacity: 0, duration: 0.8, ease: "power2.out" },
            1.5,
          );

          // Cloud Connect → proveedores: cada ruta lleva un pulso que activa su destino.
          [0, 1, 2, 3, 4].forEach((i) => {
            const t = 1.5 + i * 0.25;
            tl.to(
              "#c-ruta-" + i,
              { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.in" },
              t,
            );
            tl.set("#c-chispa-" + i, { opacity: 1 }, t);
            tl.to(
              "#c-chispa-" + i,
              { attr: { "stroke-dashoffset": -0.92 }, duration: 0.5, ease: "power2.in" },
              t,
            );
            tl.set("#c-chispa-" + i, { opacity: 0 }, t + 0.5);
            tl.to("#c-destino-" + i, { opacity: 1, duration: 0.2, ease: "power2.out" }, t + 0.5);
            tl.fromTo(
              "#c-ping-" + i,
              { attr: { r: 10 }, opacity: 0.7 },
              { attr: { r: 30 }, opacity: 0, duration: 0.6, ease: "power2.out" },
              t + 0.5,
            );
            tl.to("#c-prov-" + i, { color: "#ffffff", duration: 0.3, ease: "power2.out" }, t + 0.5);
          });
          // Todo queda estable para leer (3,2–5,5 s).

          // Salida: el esquema se retira y la nube permanece (pasa a «Beneficios» en la misma posición).
          tl.to("#c-grupo", { opacity: 0, duration: 0.45, ease: "sine.in" }, 5.55);
          tl.set({}, {}, 6);

          window.__timelines["conexion"] = tl;
        })();
      </script>
