<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Fondo de vapor: nubes muy difuminadas que ascienden y se esfuman. Texturas: scripts/generar-vapor.py -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .vapor {
          position: absolute;
          width: 1100px;
          height: 700px;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="vapor" data-width="1920" data-height="1080">
        <img
          id="v1"
          class="vapor"
          src="assets/img/vapor-1.webp"
          alt=""
          style="left: 1080px; top: -120px"
        />
        <img
          id="v2"
          class="vapor"
          src="assets/img/vapor-2.webp"
          alt=""
          style="left: 1150px; top: 560px"
        />
        <img
          id="v3"
          class="vapor"
          src="assets/img/vapor-3.webp"
          alt=""
          style="left: -420px; top: 600px"
        />
        <img
          id="v4"
          class="vapor"
          src="assets/img/vapor-4.webp"
          alt=""
          style="left: -300px; top: 80px"
        />
        <img
          id="v5"
          class="vapor"
          src="assets/img/vapor-5.webp"
          alt=""
          style="left: 410px; top: 300px"
        />
      </div>

      <script>
        (() => {
          const DURACION = 30;
          const tl = gsap.timeline({ paused: true });
          // Tres ciclos por nube; todas terminan antes de 26 s para que el cierre quede estable (últimos 4 s).
          // [id, inicio, duración, opacidad máxima, deriva x, ascenso y]
          const base = [
            ["#v1", -1.5, 6.0, 0.16, -60, -70],
            ["#v2", 0.8, 6.2, 0.13, -80, -60],
            ["#v3", -0.8, 5.6, 0.15, 70, -80],
            ["#v4", 3.0, 5.8, 0.12, 60, -60],
            ["#v5", 4.6, 5.0, 0.08, 40, -70],
          ];
          const ciclos = [0, 9, 17];
          ciclos.forEach((desfase, c) => {
            base.forEach(([id, t0, dur, pico, dx, dy]) => {
              const inicio0 = t0 + desfase;
              const d = c === 2 ? Math.min(dur, 26 - inicio0) : dur;
              const vida = gsap.timeline({ paused: true }); // la conduce el tween de abajo
              vida.fromTo(
                id,
                { x: 0, y: 0, scale: 0.85 },
                {
                  x: dx,
                  y: dy,
                  scale: 1.3,
                  duration: d,
                  ease: "sine.inOut",
                  immediateRender: false,
                },
                0,
              );
              vida.fromTo(
                id,
                { opacity: 0 },
                { opacity: pico, duration: d * 0.4, ease: "sine.out", immediateRender: false },
                0,
              );
              vida.to(id, { opacity: 0, duration: d * 0.6, ease: "sine.in" }, d * 0.4);
              // Las nubes con inicio negativo ya están en curso al empezar.
              const inicio = Math.max(0, inicio0);
              tl.add(vida.tweenFromTo(inicio - inicio0, d), inicio);
            });
          });
          gsap.set(["#v1", "#v2", "#v3", "#v4", "#v5"], { opacity: 0, transformOrigin: "50% 60%" });
          tl.set({}, {}, DURACION);
          window.__timelines["vapor"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
