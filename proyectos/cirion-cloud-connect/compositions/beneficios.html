      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          // Mismos tiempos que scripts/generar-sfx-beneficios.py (ENCENDIDOS, VIAJE y CIERRE).
          const VIAJE = 0.45;
          const encendidos = [
            ["seguridad", 1.0],
            ["flexibilidad", 2.6],
            ["disponibilidad", 4.2],
            ["performance", 5.8],
          ];
          const CIERRE = 7.3;

          // Todo el contenido está visible desde el inicio: solo se iluminan los iconos.
          encendidos.forEach(([id, t]) => {
            const pulso = document.querySelector("#b-p-" + id);
            const etiqueta = document.querySelector("#b-et-" + id + " h3");
            const color = document.querySelector("#b-et-" + id).dataset.color;
            // El pulso sale de la nube y recorre el radio; el trazo de color lo sigue.
            tl.set(pulso, { opacity: 1 }, t);
            tl.to(
              pulso,
              {
                attr: { cx: +pulso.dataset.hastaX, cy: +pulso.dataset.hastaY },
                duration: VIAJE,
                ease: "power2.in",
              },
              t,
            );
            tl.to(
              "#b-r-" + id,
              { attr: { "stroke-dashoffset": 0 }, duration: VIAJE, ease: "power2.in" },
              t,
            );
            tl.set(pulso, { opacity: 0 }, t + VIAJE);
            // Llegada: el nodo se enciende en el mismo cuadro, con un halo que se disipa.
            tl.to("#b-n-" + id, { opacity: 1, duration: 0.3, ease: "power2.out" }, t + VIAJE);
            tl.fromTo(
              "#b-ping-" + id,
              { attr: { r: 58 }, opacity: 0.6 },
              { attr: { r: 86 }, opacity: 0, duration: 0.7, ease: "power2.out" },
              t + VIAJE,
            );
            tl.to(etiqueta, { color, duration: 0.3, ease: "power2.out" }, t + VIAJE);
          });

          // Cierre: con los cuatro beneficios activos, el anillo se completa en intensidad.
          tl.to("#b-anillo", { opacity: 0.85, duration: 0.6, ease: "sine.inOut" }, CIERRE);
          tl.set({}, {}, 9);

          window.__timelines["beneficios"] = tl;
        })();
      </script>
