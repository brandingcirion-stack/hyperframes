<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Escena 1 del guion (00–04 s): ¿Qué ocurre entre tus usuarios y la nube? -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Maven Pro";
          src: url("assets/fonts/MavenPro-latin.woff2") format("woff2");
          font-weight: 400 700;
          font-display: block;
        }
        /*
          Proporción áurea (φ): foto en 0–0,382·W (733 px); texto desde 733 + H/φ⁵ (97 px) = 830 px.
          Ojos del ejecutivo y tope del titular en 0,382·H (412 px); base del titular en 0,618·H (668 px).
        */
        #root {
          position: absolute;
          inset: 0;
          font-family: "Maven Pro", sans-serif;
          color: #ffffff;
        }
        #p-foto {
          position: absolute;
          left: 30px;
          top: 216px;
          width: 744px;
          transform-origin: 40% 30%;
        }
        #p-foto img {
          display: block;
          width: 744px;
          height: auto;
        }
        #p-grupo {
          position: absolute;
          inset: 0;
        }
        #p-titular {
          position: absolute;
          left: 830px;
          top: 390px;
          margin: 0;
          font-size: 93px;
          font-weight: 700;
          line-height: 1.08;
          letter-spacing: -0.01em;
        }
        #p-titular .linea {
          display: block;
        }
      </style>

      <div id="root" data-composition-id="pregunta" data-width="1920" data-height="1080">
        <div id="p-foto">
          <img
            id="p-foto-img"
            src="assets/img/ejecutivo.webp"
            alt="Ejecutivo pensativo mirando hacia la derecha"
          />
        </div>
        <div id="p-grupo">
          <h1 id="p-titular">
            <span class="linea" id="p-l1">¿Qué ocurre entre</span>
            <span class="linea" id="p-l2">tus <span id="p-usuarios">usuarios</span> y</span>
            <span class="linea" id="p-l3">la <span id="p-nube">nube</span>?</span>
          </h1>
          <!-- Filamento: sale de «usuarios» y llega a «nube» (medido sobre Maven Pro 93 px) -->
          <svg
            style="position: absolute; inset: 0"
            width="1920"
            height="1080"
            viewBox="0 0 1920 1080"
            aria-hidden="true"
          >
            <defs>
              <linearGradient
                id="p-grad-filamento"
                x1="996"
                y1="0"
                x2="1520"
                y2="0"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0" stop-color="#EF2AC1" />
                <stop offset="1" stop-color="#00A7E1" />
              </linearGradient>
            </defs>
            <path
              id="p-filamento"
              d="M996 592 H1356 C1520 592 1520 690 1356 690 H937"
              fill="none"
              stroke="url(#p-grad-filamento)"
              stroke-width="3"
              stroke-linecap="round"
              pathLength="1"
              stroke-dasharray="1"
              stroke-dashoffset="1"
              style="filter: drop-shadow(0 0 6px rgba(239, 42, 193, 0.6))"
            />
            <!-- Chispa que recorre el filamento -->
            <path
              id="p-chispa"
              d="M996 592 H1356 C1520 592 1520 690 1356 690 H937"
              fill="none"
              stroke="#ffffff"
              stroke-width="5"
              stroke-linecap="round"
              pathLength="1"
              stroke-dasharray="0.04 1"
              stroke-dashoffset="0.04"
              opacity="0"
              style="filter: drop-shadow(0 0 8px #ffffff)"
            />
          </svg>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          // Tiempos en la grilla de 120 BPM (scripts/generar-audio.py): «usuarios» en 1,0 s; «nube» en 2,0 s.
          gsap.set(["#p-l1", "#p-l2", "#p-l3"], { y: 50, opacity: 0 });
          gsap.set("#p-foto-img", { opacity: 0 });
          gsap.set("#p-foto", { scale: 1.04, filter: "blur(0px)" });

          tl.to("#p-foto-img", { opacity: 1, duration: 0.8, ease: "sine.out" }, 0);
          tl.to("#p-foto", { scale: 1, duration: 2.4, ease: "power2.out" }, 0);
          tl.to(
            ["#p-l1", "#p-l2", "#p-l3"],
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.12 },
            0.3,
          );

          // «usuarios» se enciende y lanza el filamento; al llegar, enciende «nube» en el mismo cuadro.
          tl.fromTo(
            "#p-usuarios",
            { color: "#ffffff" },
            { color: "#EF2AC1", duration: 0.3, ease: "power2.out" },
            1.0,
          );
          tl.to(
            "#p-filamento",
            { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "power1.inOut" },
            1.0,
          );
          tl.set("#p-chispa", { opacity: 1 }, 1.0);
          tl.to(
            "#p-chispa",
            { attr: { "stroke-dashoffset": -0.96 }, duration: 1.0, ease: "power1.inOut" },
            1.0,
          );
          tl.to("#p-chispa", { opacity: 0, duration: 0.2, ease: "power1.out" }, 2.0);
          tl.fromTo(
            "#p-nube",
            { color: "#ffffff" },
            { color: "#EF2AC1", duration: 0.3, ease: "power2.out" },
            2.0,
          );

          // Salida: la foto se esfuma como vapor; el titular sale hacia la izquierda (cut-the-curve LEFT).
          tl.to(
            "#p-foto",
            { filter: "blur(16px)", scale: 1.03, duration: 0.5, ease: "power1.in" },
            3.45,
          );
          tl.to("#p-foto-img", { opacity: 0, duration: 0.45, ease: "sine.in" }, 3.5);
          tl.to("#p-grupo", { x: -230, duration: 0.34, ease: "power4.in" }, 3.66);
          tl.to("#p-grupo", { opacity: 0, duration: 0.22, ease: "power1.in" }, 3.76);
          tl.set({}, {}, 4);

          window.__timelines["pregunta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
